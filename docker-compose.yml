version: '3.8'

services:
  # Frontend client
  client:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: order-management-client-dev
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:4000
    depends_on:
      - api
    networks:
      - app-network
    command: pnpm dev --host

  # Backend API
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: order-management-api-dev
    ports:
      - "4000:4000"
    volumes:
      - ./server:/app
      - /app/node_modules
    environment:
      - PORT=4000
      - NODE_ENV=development
      - API_HOST=0.0.0.0
      - API_PORT=4000
      - DATABASE_HOST=db
      - DATABASE_PORT=3306
      - DATABASE_NAME=order_management
      - DATABASE_USER=root
      - DATABASE_PASSWORD=root
      - DATABASE_URL=mysql://root:root@db:3306/order_management
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  # Database (MySQL)
  db:
    image: mysql:8.0
    container_name: order-management-db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=order_management
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional: Database management tool
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: order-management-phpmyadmin
    ports:
      - "5050:80"
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
      - MYSQL_ROOT_PASSWORD=root
    depends_on:
      - db
    networks:
      - app-network

volumes:
  mysql-data:

networks:
  app-network:
    name: order-management-network-dev 